name: Keep the live demo warm

# The free Render instance sleeps after 15 idle minutes and then takes about a minute to wake.
# During the evaluation period, a light request every 10 minutes (08:00-22:00 IST) keeps it awake
# for judges. Disable this workflow in the Actions tab once evaluation is over.
on:
  schedule:
    - cron: "*/10 2-16 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -o /dev/null -w "%{http_code} in %{time_total}s\n" --max-time 120 https://vidya-pramaan-sih26263.onrender.com/api/meta
